<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><title>Chart time axis test fixture</title></head>
  <body style="margin:0;background:#0f1117">
    <p id="fixture-help">Chart time axis test fixture · sample candles, no broker connection</p>
    <div id="root"></div>
    <script>
      if (location.protocol === 'file:') {
        document.getElementById('fixture-help').innerHTML =
          'This test fixture needs the Vite dev server to compile TSX. Run <code>cd frontend &amp;&amp; npm run dev</code>, then open ' +
          '<a href="http://127.0.0.1:5173/e2e/fixtures/chart-time-axis.html">the chart time axis fixture</a>.';
      } else {
        const moduleScript = document.createElement('script');
        moduleScript.type = 'module';
        moduleScript.src = './chartTimeAxis.tsx';
        document.body.append(moduleScript);
      }
    </script>
  </body>
</html>
