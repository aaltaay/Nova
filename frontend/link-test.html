<!doctype html>
<!--
  The phone link test (ADR 070): a light page that measures this device against
  Nova on the PC -- round trip, clock, and how old Level 2 and the tape are on
  arrival. The test reads only and holds no API key; its Paper orders block
  sends only after the phone PIN. The manifest lets Chrome put it on the
  phone's home screen, full screen ("Add to Home screen").
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="/phone/manifest.webmanifest">
<link rel="icon" href="/phone/icon-192.png">
<title>Nova link test</title>
</head>
<body>
<script type="module" src="/src/phone_link/linkTestPage.ts"></script>
</body>
</html>
