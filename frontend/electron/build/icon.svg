<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Nova app icon (large: 64 px and up). The 16-48 px sizes use icon-small.svg.
       Rebuild the .ico after editing: npm run icons -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13203a"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <radialGradient id="halo" cx="512" cy="512" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38d2ff" stop-opacity=".55"/>
      <stop offset=".35" stop-color="#0a84ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="512" cy="512" r="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".25" stop-color="#9ff0ff"/>
      <stop offset=".6" stop-color="#28c8ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6ecff"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#tile)"/>
  <rect x="33.5" y="33.5" width="957" height="957" rx="214.5" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="3"/>
  <circle cx="512" cy="512" r="330" fill="url(#halo)"/>
  <path fill="#bcdcff" d="M692.3 331.7L576 512L692.3 692.3L512 576L331.7 692.3L448 512L331.7 331.7L512 448Z"/>
  <path fill="url(#ray)" d="M512 100L564.3 459.7L924 512L564.3 564.3L512 924L459.7 564.3L100 512L459.7 459.7Z"/>
  <circle cx="512" cy="512" r="96" fill="url(#core)"/>
  <circle cx="512" cy="512" r="26" fill="#ffffff"/>
