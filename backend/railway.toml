# DEPRECATED (2026-08-05): Nova no longer hosts the backend on Railway.
# Do not point a Railway service Config-as-code path here. Local / Desktop only.
# See AGENTS.md §8 and README.md Deploy.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
