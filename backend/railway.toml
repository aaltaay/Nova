# Used when the service "Config as code" path is /backend/railway.toml and
# Root Directory is `backend`. Docker avoids Railpack guessing wrong.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
