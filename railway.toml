# Root config for monorepo deploys when Railway does not use a subdirectory as
# the service root. Forces Docker so Railpack is not asked to infer Python
# from the repo root (where there is no requirements.txt).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
