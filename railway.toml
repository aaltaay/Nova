# DEPRECATED (2026-08-05): Nova no longer hosts the backend on Railway.
# Kept only so old dashboard links do not confuse operators; do not wire new
# services to this file. Backend runs locally / Desktop sidecar only.
# See AGENTS.md §8 and README.md Deploy.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
