# Keep the backlog answerable: "what should we work on next?"
#
# The plan lives on GitHub, not in a chat transcript:
#   * a milestone per work package (title `NN - slug`, so GitHub's own
#     alphabetical listing reads as the rank)
#   * labels P0-P3 / kind / domain:* / deferred on every issue
#   * GitHub Issues/milestones for the narrative
#
# Any consumer can read that -- `gh`, a webhook, a dashboard, a non-Claude
# bot -- because milestones and labels are first-class API objects. This job
# is the periodic sweep that stops it rotting:
#
#   Monday 13:05 UTC (09:05 ET, before the week's work starts)
#     report hygiene gaps -- issues with no package or no labels -- and fail
#     the job if there are any, so a clean backlog is silent and a rotting
#     one is a red run rather than a comment nobody reads.
#
# There is no pinned rollup issue. One existed (#361) and was retired: a
# weekly-refreshed cache of a backlog that changes daily is wrong six days
# out of seven, and it drifted far enough to list 33 closed issues as open
# and to route agents at the retired BACKLOG.md. `backlog_triage.py report`
# answers the same question on demand, from GitHub, always current.
#
# Deliberately NOT a required check on PRs. A new issue is unpackaged for
# the minutes between filing and triage; failing CI for that would train
# agents to skip filing issues, which is the opposite of what we want.
#
# Cron is best-effort under GitHub load. workflow_dispatch is the manual
# path; `python tools/backlog_triage.py report` is the local one.
#
# Token: GITHUB_TOKEN is enough (issues: write covers editing the Map).

name: Backlog triage

on:
  schedule:
    - cron: "5 13 * * 1"
  workflow_dispatch:

concurrency:
  group: backlog-triage
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  triage:
    name: Sweep the backlog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest
        run: pip install pytest

      - name: Unit tests (the report must hold before it can publish)
        run: python -m pytest tools/test_backlog_triage.py -q --tb=short

      - name: Report hygiene gaps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOVA_GITHUB_REPO: ${{ github.repository }}
        run: python tools/backlog_triage.py check
