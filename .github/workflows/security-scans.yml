# Advisory scans run on relevant changes, daily, and on manual dispatch.
name: Security scans
on:
  workflow_call:
    inputs:
      source:
        type: boolean
        required: true
      dependencies:
        type: boolean
        required: true
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-audit:
    if: (github.event_name != 'pull_request' && github.event_name != 'push') || inputs.source
    name: Security audit (warning-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs on PR and push, same as backend-test.
    # continue-on-error: true keeps the pipeline green while the baseline is being established.
    # After baseline acceptance, remove continue-on-error and add --fail-on-findings
    # to tools/security_audit.py invocation to block on new CRITICAL/HIGH findings.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dev dependencies (includes pip-audit + cvss)
        run: pip install -r backend/requirements-dev.txt

      - name: Run security audit
        # Exits 0 always (warning-first). JSON output is captured as an artifact.
        # To enable blocking on findings: add --fail-on-findings and remove continue-on-error above.
        run: python tools/security_audit.py --json | tee security-audit-report.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: security-audit-report.json
          retention-days: 30

  # SEC-005 — dedicated scanners (gitleaks, osv-scanner, semgrep). Warning-only
  # until the baseline is clean enough to gate deploy.
  osv-scanner:
    if: (github.event_name != 'pull_request' && github.event_name != 'push') || inputs.dependencies
    name: OSV Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Warning-only (SEC-005). v2 dropped --skip-git (skip is now default).
      # Step continue-on-error keeps the check green; vulns stay in the log.
      - uses: google/osv-scanner-action/osv-scanner-action@v2.0.3
        continue-on-error: true
        with:
          scan-args: |-
            -r
            ./

  semgrep:
    if: (github.event_name != 'pull_request' && github.event_name != 'push') || inputs.source
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: p/python
