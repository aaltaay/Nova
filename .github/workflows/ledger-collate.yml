# Generate CHANGELOG.md from merged pull requests. Agents write nothing.
#
# The problem (#344): CHANGELOG.md, PROBLEM_LOG.md and task-log/INDEX.md are
# PREPENDED by nearly every PR, so two agents working in parallel always
# collide at line 1 -- on paperwork, not on code. With N agents that is N^2
# conflict pairs carrying no engineering value in the diff.
#
# The fix is not "resolve those conflicts faster", it is to remove the write.
# AGENTS.md 7.2b already makes the PR body the home for the task narrative
# (What / Why this approach / Verified by), so the changelog entry is derived
# from work the agent has already done and reviewed. An agent's PR contains no
# CHANGELOG diff at all, so there is nothing to conflict on.
#
# Only this job writes the ledger, and only on master. It opens a PR rather
# than pushing, because master is protected and a direct push is rejected
# (GH006) -- the same shape as the ai-news digest job.
#
# `.changes/last-collated` is the watermark: the highest PR number already
# folded in. The job runs on a fresh checkout with no other memory, so without
# it a re-run would duplicate every entry it already wrote.
#
# Fragments under .changes/unreleased/ are the escape hatch for work with no
# PR (a direct push, an ops diagnosis); they are folded in and deleted here.

name: Ledger collate

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Two overlapping runs would race on the same branch and double-write entries.
concurrency:
  group: ledger-collate
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  collate:
    name: Generate the changelog
    # A push whose head is the collation PR itself would loop.
    if: "!contains(github.event.head_commit.message, 'chore(ledger): collate')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.NOVA_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest
        run: pip install pytest

      - name: Unit tests (the renderer must hold before it can write)
        run: python -m pytest tools/test_changes_fragments.py -q --tb=short

      - name: Collate merged PRs and fragments into the ledger
        env:
          GH_TOKEN: ${{ secrets.NOVA_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
        run: python tools/changes_collate.py --date "$(date -u +%Y-%m-%d)"

      - name: Open or update the ledger PR when anything changed
        env:
          GH_TOKEN: ${{ secrets.NOVA_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "Ledger already current."
            exit 0
          fi
          BRANCH=chore/ledger-collate
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add CHANGELOG.md PROBLEM_LOG.md .changes knowledge/problems 2>/dev/null || true
          git commit -m "chore(ledger): collate merged PRs into CHANGELOG.md"
          git push --force-with-lease origin "$BRANCH"
          gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh pr create --repo "$GITHUB_REPOSITORY" --base "${GITHUB_REF_NAME}" --head "$BRANCH" \
              --title "chore(ledger): collate merged PRs into CHANGELOG.md" \
              --body "Generated by \`tools/changes_collate.py\` from merged PR bodies and any \`.changes/unreleased/\` fragments. Agents no longer hand-edit the ledger (#344 WS2)."
