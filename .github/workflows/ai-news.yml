# Refresh the public AI-in-trading digest on nova.altaystudio.com.
#
# Static site: no API, no secrets. This job pre-renders the homepage teaser
# and the /news feed. When those files change it opens or updates a ready
# PR from chore/ai-news-digest -- it never pushes master (GH006: required
# status checks reject a direct digest commit). Vercel redeploys from git
# after that PR merges. Vercel is often rate-limited; the git history can
# still move while the live CDN lags.
#
# GitHub cron is best-effort (often delayed under load). 10 minutes is the
# target, not a hard SLA. 5 minutes is not worth the extra queue noise.
#
# Sources are public RSS/Atom and the generator is stdlib-only. A thin
# fetch exits without overwriting a good /news page.
#
# Token: prefer repo secret NOVA_PROJECT_TOKEN (same PAT as the Nova
# Delivery project workflow, scopes include repo) so the digest PR triggers
# CI. GITHUB_TOKEN can open a PR but GitHub will not run workflows on
# GITHUB_TOKEN-created pull_request events.

name: AI news digest

on:
  schedule:
    # Every 10 minutes, offset from :00 so we are not in the hourly stampede.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

# Serialize: two overlapping runs would race on the same branch/PR.
concurrency:
  group: ai-news-digest
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Refresh digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.NOVA_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest
        run: pip install pytest

      - name: Unit tests (ranking must hold before it can publish)
        run: python -m pytest tools/test_ai_news*.py -q

      - name: Rebuild the digest
        run: python tools/ai_news_digest.py --limit 6 --feed-limit 60

      - name: Open or update digest PR when the pages changed
        env:
          GH_TOKEN: ${{ secrets.NOVA_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
        run: python tools/ai_news_digest_pr.py
