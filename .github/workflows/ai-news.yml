# Refresh the public AI-in-trading digest on nova.altaystudio.com.
#
# Static site: no API, no secrets. This job pre-renders /news (and the
# homepage count tease), then opens or updates a PR. It never pushes master.
# Vercel publishes from git after that PR merges. Vercel free is rate-limited;
# unchanged story identity does not rewrite, so a 10-minute no-op is free.
#
# GitHub cron is best-effort (often delayed under load). 10 minutes is the
# target, not a hard SLA. 5 minutes is not worth the extra queue noise.
#
# Sources are public RSS/Atom and the generator is stdlib-only. A thin
# fetch exits without overwriting a good /news page.

name: AI news digest

on:
  schedule:
    # Every 10 minutes, offset from :00 so we are not in the hourly stampede.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

# Serialize: two overlapping runs would race on the same commit.
concurrency:
  group: ai-news-digest
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Refresh digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest
        run: pip install pytest

      - name: Unit tests (ranking must hold before it can publish)
        run: python -m pytest tools/test_ai_news_digest.py -q

      - name: Rebuild the digest
        run: python tools/ai_news_digest.py --feed-limit 80

      - name: Open or update digest PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/ai_news_pr.py
