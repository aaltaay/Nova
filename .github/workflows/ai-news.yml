# Refresh the public AI-in-trading digest on nova.altaystudio.com.
#
# Static site: no API, no secrets. This job pre-renders the homepage teaser
# and the /news feed, then commits when the HTML changed. Vercel redeploys
# from git -- that is the publish step. Vercel is often rate-limited; the
# git history can still move while the live CDN lags.
#
# GitHub cron is best-effort (often delayed under load). 10 minutes is the
# target, not a hard SLA. 5 minutes is not worth the extra queue noise.
#
# Sources are public RSS/Atom and the generator is stdlib-only. A thin
# fetch exits without overwriting a good /news page.

name: AI news digest

on:
  schedule:
    # Every 10 minutes, offset from :00 so we are not in the hourly stampede.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

# Serialize: two overlapping runs would race on the same commit.
concurrency:
  group: ai-news-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest
        run: pip install pytest

      - name: Unit tests (ranking must hold before it can publish)
        run: python -m pytest tools/test_ai_news_digest.py -q

      - name: Rebuild the digest
        run: python tools/ai_news_digest.py --limit 6 --feed-limit 60

      - name: Commit when the pages changed
        run: |
          if git diff --quiet -- site/index.html site/news/index.html site/news/feed.json; then
            echo "No change to the digest."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/news/index.html site/news/feed.json
          git commit -m "chore(site): refresh AI-in-trading news feed"
          git push
