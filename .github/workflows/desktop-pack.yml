# Windows desktop installer (NSIS) + the electron-updater feed; Release on a tag
#
# Application-affecting PRs/pushes and manual runs (docs/site skip packaging):
#   1. Stamp VERSION / package.json from `git rev-list --count HEAD` (full history).
#   2. Pack the Electron + FastAPI sidecar as the NSIS installer. Installer only
#      since #347 -- a portable EXE can never update itself.
#   3. Prove Nova-Setup-vNNN.exe, its .blockmap and latest.yml exist and agree on
#      the version, then upload the three as one workflow artifact.
#
# Master merges (pushed, or dispatched by PR delivery after an Actions merge,
# #346) build and verify only -- they publish nothing. A Release is now an update
# prompt on the operator's desk, so one per merged PR would train dismissal.
#
# Publishing is a deliberate operator act (#347): on an up-to-date master run
#   py -3 tools/bump_version.py --ensure-tag --push-tag
# and this workflow packs that tagged commit and creates the GitHub Release with
# Nova-Setup-vNNN.exe + .blockmap + latest.yml -- the feed electron-updater reads.
# A tag pushed by Actions would start no run, so nothing automated can cut one.
# Re-run a publish with: gh workflow run desktop-pack.yml --ref vNNN
# (A tag push has no diff base, and `tools/ci_scope.py` selects full verification
# whenever the diff is unavailable, so a release always packs.)
# GitHub also adds Source code zip/tar -- those are not the app.

name: Desktop pack

on:
  push:
    branches: [main, master]
    # Release tags only: vNNN, the commit count of the tagged commit.
    tags: ["v[0-9]+"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: desktop-pack-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/ci-scope.yml

  desktop-pack:
    name: Desktop pack
    needs: [changes]
    if: always()
    runs-on: ${{ needs.changes.outputs.desktop == 'false' && 'ubuntu-latest' || 'windows-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.rev.outputs.tag }}
    steps:
      - name: Verify scope decision
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.desktop }}
        run: |
          test "$SCOPE_RESULT" = success
          case "$SELECTED" in
            true) echo 'Selected: running verification.' >> "$GITHUB_STEP_SUMMARY" ;;
            false) echo 'Unaffected: heavy verification not needed.' >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo 'Invalid CI scope output'; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        if: needs.changes.outputs.desktop == 'true'
        with:
          fetch-depth: 0
          # Pack the PR head, not GitHub's merge commit (that extra commit
          # would bump vNNN by one versus the branch the reviewer is on).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        if: needs.changes.outputs.desktop == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.desktop == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Windows maintenance setup and failure reporting
        if: needs.changes.outputs.desktop == 'true'
        run: |
          python -m pip install pytest
          python -m pytest tools/test_windows_maintenance.py tools/test_repo_hygiene_finish.py -q

      - name: Cache Electron downloads
        if: needs.changes.outputs.desktop == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-win-${{ hashFiles('frontend/package-lock.json') }}

      - name: Stamp vNNN from full git history
        if: needs.changes.outputs.desktop == 'true'
        id: rev
        shell: pwsh
        run: |
          python tools/bump_version.py --sync
          $tag = (python tools/bump_version.py --print-tag).Trim()
          if (-not $tag) { throw "bump_version --print-tag returned empty" }
          # A release tag must be this commit's own revision, or the installed
          # app would report a version the Release does not carry and the
          # updater would compare the wrong number.
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "release tag $env:GITHUB_REF_NAME is not this commit's revision $tag -- tag with: py -3 tools/bump_version.py --ensure-tag --push-tag"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "NOVA_RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "revision $tag"

      - name: Install backend + PyInstaller
        if: needs.changes.outputs.desktop == 'true'
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller

      - name: Install frontend
        if: needs.changes.outputs.desktop == 'true'
        run: npm ci
        working-directory: frontend

      - name: Pack the Windows installer
        if: needs.changes.outputs.desktop == 'true'
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://ci-placeholder.invalid' }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          NOVA_RELEASE_TAG: ${{ env.NOVA_RELEASE_TAG }}
          NOVA_PYTHON: python
        run: npm run electron:pack

      - name: Prove the installer and its update feed agree
        if: needs.changes.outputs.desktop == 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.rev.outputs.tag }}"
          $setup = "frontend/release/Nova-Setup-$tag.exe"
          $feed = "frontend/release/latest.yml"
          foreach ($file in @($setup, "$setup.blockmap", $feed)) {
            if (-not (Test-Path $file)) { throw "missing $file" }
          }
          # latest.yml is what an installed desk reads to decide it is behind,
          # so a Release whose feed names another build is worse than none.
          $version = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
          $yml = Get-Content $feed -Raw
          if ($yml -notmatch "(?m)^version: ['""]?$([regex]::Escape($version))['""]?\s*$") {
            throw "latest.yml does not advertise $version"
          }
          if ($yml -notmatch "(?m)^path: ['""]?Nova-Setup-$tag\.exe['""]?\s*$") {
            throw "latest.yml does not point at Nova-Setup-$tag.exe"
          }
          Write-Host "$tag -> $version"
          Get-Item $setup, "$setup.blockmap", $feed | Format-Table Name, Length

      - name: Upload the installer and update feed
        if: needs.changes.outputs.desktop == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Nova-${{ steps.rev.outputs.tag }}-win
          path: |
            frontend/release/Nova-Setup-${{ steps.rev.outputs.tag }}.exe
            frontend/release/Nova-Setup-${{ steps.rev.outputs.tag }}.exe.blockmap
            frontend/release/latest.yml
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish vNNN installer
    timeout-minutes: 10
    # Release tags only (#347). A master push -- human, or PR delivery's
    # dispatch after an Actions merge (#346) -- builds and verifies above and
    # stops here. `workflow_dispatch` on a tag ref re-runs a publish.
    if: needs.changes.outputs.desktop == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    needs: [changes, desktop-pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the installer and update feed
        uses: actions/download-artifact@v4
        with:
          name: Nova-${{ needs.desktop-pack.outputs.tag }}-win
          path: dist-win

      - name: Attach the installer and update feed to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.desktop-pack.outputs.tag }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The pack refuses a mismatched tag; refuse it again before publishing.
          test "$TAG" = "$REF_TAG"
          SETUP="dist-win/Nova-Setup-${TAG}.exe"
          test -f "$SETUP"
          test -f "${SETUP}.blockmap"
          test -f dist-win/latest.yml
          NOTES="$(printf 'Nova %s Windows desktop.\n\n- Installer: Nova-Setup-%s.exe (NSIS, x64)\n- latest.yml + .blockmap are the in-app update feed; installed desks offer this build and install it when you choose Restart to update.\n\nBuilds are unsigned, so SmartScreen warns on a fresh download.\nGitHub also attaches Source code zip/tar automatically. Those are not the app.' "$TAG" "$TAG")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$SETUP" "${SETUP}.blockmap" dist-win/latest.yml --clobber
          else
            gh release create "$TAG" "$SETUP" "${SETUP}.blockmap" dist-win/latest.yml \
              --title "$TAG" --notes "$NOTES" --verify-tag --latest
          fi
