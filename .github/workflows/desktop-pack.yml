# Windows desktop installer + portable EXE + vNNN GitHub Release
#
# Application-affecting PRs/pushes and manual runs (docs/site skip packaging):
#   1. Stamp VERSION / package.json from `git rev-list --count HEAD` (full history).
#   2. Pack the Electron + FastAPI sidecar as NSIS installer and portable EXE.
#   3. Upload both EXEs as a workflow artifact (required files).
#
# On push to master/main only, after a successful pack:
#   create git tag vNNN if missing, then create or update the GitHub Release
#   and attach Nova-Setup-vNNN.exe + Nova-Portable-vNNN.exe.
#   GitHub also adds Source code zip/tar -- those are not the app.

name: Desktop pack

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: desktop-pack-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/ci-scope.yml

  desktop-pack:
    name: Desktop pack
    needs: [changes]
    if: always()
    runs-on: ${{ needs.changes.outputs.desktop == 'false' && 'ubuntu-latest' || 'windows-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.rev.outputs.tag }}
    steps:
      - name: Verify scope decision
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.desktop }}
        run: |
          test "$SCOPE_RESULT" = success
          case "$SELECTED" in
            true) echo 'Selected: running verification.' >> "$GITHUB_STEP_SUMMARY" ;;
            false) echo 'Unaffected: heavy verification not needed.' >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo 'Invalid CI scope output'; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        if: needs.changes.outputs.desktop == 'true'
        with:
          fetch-depth: 0
          # Pack the PR head, not GitHub's merge commit (that extra commit
          # would bump vNNN by one versus the branch the reviewer is on).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        if: needs.changes.outputs.desktop == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.desktop == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Windows maintenance setup and failure reporting
        if: needs.changes.outputs.desktop == 'true'
        run: |
          python -m pip install pytest
          python -m pytest tools/test_windows_maintenance.py tools/test_repo_hygiene_finish.py -q

      - name: Cache Electron downloads
        if: needs.changes.outputs.desktop == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-win-${{ hashFiles('frontend/package-lock.json') }}

      - name: Stamp vNNN from full git history
        if: needs.changes.outputs.desktop == 'true'
        id: rev
        shell: pwsh
        run: |
          python tools/bump_version.py --sync
          $tag = (python tools/bump_version.py --print-tag).Trim()
          if (-not $tag) { throw "bump_version --print-tag returned empty" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "NOVA_RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "revision $tag"

      - name: Install backend + PyInstaller
        if: needs.changes.outputs.desktop == 'true'
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller

      - name: Install frontend
        if: needs.changes.outputs.desktop == 'true'
        run: npm ci
        working-directory: frontend

      - name: Pack Windows installer and portable
        if: needs.changes.outputs.desktop == 'true'
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://ci-placeholder.invalid' }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          NOVA_RELEASE_TAG: ${{ env.NOVA_RELEASE_TAG }}
          NOVA_PYTHON: python
        run: npm run electron:pack

      - name: Prove both EXEs exist
        if: needs.changes.outputs.desktop == 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.rev.outputs.tag }}"
          $setup = "frontend/release/Nova-Setup-$tag.exe"
          $portable = "frontend/release/Nova-Portable-$tag.exe"
          if (-not (Test-Path $setup)) { throw "missing $setup" }
          if (-not (Test-Path $portable)) { throw "missing $portable" }
          Get-Item $setup, $portable | Format-Table Name, Length

      - name: Upload Windows EXEs
        if: needs.changes.outputs.desktop == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Nova-${{ steps.rev.outputs.tag }}-win
          path: |
            frontend/release/Nova-Setup-${{ steps.rev.outputs.tag }}.exe
            frontend/release/Nova-Portable-${{ steps.rev.outputs.tag }}.exe
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish vNNN EXEs
    timeout-minutes: 10
    if: needs.changes.outputs.desktop == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    needs: [changes, desktop-pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download Windows EXEs
        uses: actions/download-artifact@v4
        with:
          name: Nova-${{ needs.desktop-pack.outputs.tag }}-win
          path: dist-win

      - name: Tag and attach EXEs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.desktop-pack.outputs.tag }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          python tools/bump_version.py --ensure-tag
          if ! git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            git push origin "refs/tags/${TAG}"
          fi
          SETUP="dist-win/Nova-Setup-${TAG}.exe"
          PORTABLE="dist-win/Nova-Portable-${TAG}.exe"
          test -f "$SETUP"
          test -f "$PORTABLE"
          NOTES="$(printf 'Nova %s Windows desktop.\n\n- Installer: Nova-Setup-%s.exe (NSIS)\n- Portable: Nova-Portable-%s.exe (no install)\n\nGitHub also attaches Source code zip/tar automatically. Those are not the app.' "$TAG" "$TAG" "$TAG")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$SETUP" "$PORTABLE" --clobber
          else
            gh release create "$TAG" "$SETUP" "$PORTABLE" --title "$TAG" --notes "$NOTES" --verify-tag
          fi
