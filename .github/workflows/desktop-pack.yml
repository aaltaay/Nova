# Windows desktop installer (NSIS EXE) + vNNN tags
#
# Every PR and every push to master/main:
#   1. Stamp VERSION / package.json from `git rev-list --count HEAD` (full history).
#   2. Pack the Electron + FastAPI sidecar installer.
#   3. Upload Nova-Setup-vNNN.exe as a workflow artifact (required file).
#
# On push to master/main only, after a successful pack:
#   create lightweight git tag vNNN if it is missing. No GitHub Release.

name: Desktop pack

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: desktop-pack-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop-pack:
    name: Desktop pack
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-win-${{ hashFiles('frontend/package-lock.json') }}

      - name: Stamp vNNN from full git history
        id: rev
        shell: pwsh
        run: |
          python tools/bump_version.py --sync
          $tag = (python tools/bump_version.py --print-tag).Trim()
          if (-not $tag) { throw "bump_version --print-tag returned empty" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "NOVA_RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "revision $tag"

      - name: Install backend + PyInstaller
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller

      - name: Install frontend
        run: npm ci
        working-directory: frontend

      - name: Pack Windows installer
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://ci-placeholder.invalid' }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          NOVA_RELEASE_TAG: ${{ env.NOVA_RELEASE_TAG }}
        run: npm run electron:pack

      - name: Upload installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Setup-${{ steps.rev.outputs.tag }}
          path: frontend/release/Nova-Setup-${{ steps.rev.outputs.tag }}.exe
          if-no-files-found: error
          retention-days: 14

  release-tag:
    name: Create vNNN tag
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    needs: [desktop-pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create and push vNNN tag
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          TAG="$(python tools/bump_version.py --print-tag)"
          echo "HEAD tag is ${TAG}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "remote already has ${TAG}"
            exit 0
          fi
          python tools/bump_version.py --ensure-tag
          git push origin "refs/tags/${TAG}"
