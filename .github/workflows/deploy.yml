# CI + Railway deploy
#
# On every push to main and on PRs targeting main:
#   1. backend-test  — install Python deps, run pytest (no tests = OK, real failures block)
#   2. frontend-build — npm ci + vite build (catches TypeScript / import errors)
#   3. deploy (main push only, after both jobs pass) — Railway CLI deploy
#
# Required GitHub secrets:
#   RAILWAY_TOKEN       — Railway API token (Settings → Tokens → New token)
#
# Required GitHub variables (Settings → Variables → Actions):
#   RAILWAY_SERVICE_NAME   — name of the Railway service (e.g. "backend")
#   VITE_API_BASE_URL      — public HTTPS URL of the Railway backend for the
#                            frontend build, e.g. https://backend.up.railway.app
#
# IMPORTANT: When this workflow is active, disable Railway's built-in
# "Deploy on push" in the Railway dashboard (Service → Settings → Source)
# to avoid duplicate deploys on every push to main.

name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest

      - name: Run tests
        # Exit 5 means "no tests collected" — acceptable until tests are added.
        # Any other non-zero exit (real failures) still blocks the workflow.
        run: |
          pytest backend/ -x -q --tb=short
          PYTEST_EXIT=$?
          if [ $PYTEST_EXIT -eq 5 ]; then
            echo "No tests collected — OK"
            exit 0
          fi
          exit $PYTEST_EXIT
        shell: bash

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          # Use the production backend URL so the build verifies against the
          # real API base; falls back to localhost if variable is not set.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

  deploy:
    name: Deploy to Railway
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    # Only deploy on direct pushes to main, not on PRs.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend service
        # --detach: don't wait for the deployment to finish (Railway streams
        # build logs in the dashboard; CI just triggers and moves on).
        run: railway up --service "$RAILWAY_SERVICE_NAME" --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME }}
