# CI (no cloud backend deploy)
#
# Backend is local / Desktop sidecar only -- Railway hosting is retired.
# On every push to main/master and on PRs targeting those branches:
#   1. backend-test   -- Ruff + pytest
#   2. frontend-build -- ESLint + Vitest + production build
#   3. frontend-e2e   -- Playwright Chromium
#   4. security / agent-contract jobs (warning-only where noted)
#   5. doc_invariants.py + engineering_skills_audit.py
#   6. Desktop pack (Windows installer + portable EXE + vNNN Release) lives
#      in desktop-pack.yml -- required before merge; this file stays the
#      Linux test/lint/e2e gate.
#
# Optional GitHub variable (Settings → Variables → Actions):
#   VITE_API_BASE_URL -- override for frontend CI build; defaults to a placeholder.
# Optional static frontend host: Vercel Git integration (not this workflow).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Lets you run CI from Actions → CI → “Run workflow” when nothing has triggered yet
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest pytest-asyncio ruff==0.15.21

      - name: Ruff
        run: ruff check backend

      - name: Run tests
        run: pytest backend/ -x -q --tb=short

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Unit tests
        run: npm test -- --run
        working-directory: frontend

      - name: Build
        # Default URL keeps vite/meta/postbuild happy when Actions var is unset.
        run: |
          export VITE_API_BASE_URL="${VITE_API_BASE_URL:-https://ci-placeholder.invalid}"
          npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Playwright
        run: npm run test:e2e
        working-directory: frontend

  security-audit:
    name: Security audit (warning-only)
    runs-on: ubuntu-latest
    # Runs on PR and push, same as backend-test.
    # continue-on-error: true keeps the pipeline green while the baseline is being established.
    # After baseline acceptance, remove continue-on-error and add --fail-on-findings
    # to tools/security_audit.py invocation to block on new CRITICAL/HIGH findings.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dev dependencies (includes pip-audit + cvss)
        run: pip install -r backend/requirements-dev.txt

      - name: Run security audit
        # Exits 0 always (warning-first). JSON output is captured as an artifact.
        # To enable blocking on findings: add --fail-on-findings and remove continue-on-error above.
        run: python tools/security_audit.py --json | tee security-audit-report.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: security-audit-report.json
          retention-days: 30

  # SEC-005 — dedicated scanners (gitleaks, osv-scanner, semgrep). Warning-only
  # until the baseline is clean enough to gate deploy.
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Warning-only: step continue-on-error keeps the check green while
      # leaks still show in the job log. Job-level continue-on-error still
      # reports the check as failed.
      - uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  osv-scanner:
    name: OSV Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Warning-only (SEC-005). v2 dropped --skip-git (skip is now default).
      # Step continue-on-error keeps the check green; vulns stay in the log.
      - uses: google/osv-scanner-action/osv-scanner-action@v2.0.3
        continue-on-error: true
        with:
          scan-args: |-
            -r
            ./

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: p/python

  agent-contract:
    name: Agent contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest
        run: pip install pytest

      - name: Agent tool tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tools/test_agent_contract.py tools/test_subagent_lifecycle_hook.py tools/test_sync_agent_surfaces.py tools/test_create_nova_agent.py tools/test_doc_invariants.py tools/test_engineering_skills_audit.py tools/test_stale_pr_branches.py tools/test_desktop_pack_workflow.py tools/test_master_branch_protection.py tools/test_pr_delivery.py tools/test_pr_delivery_workflow.py tools/test_nova_delivery_project.py tools/test_ai_news_digest_pr.py -q --tb=short

      - name: Structural validation (CI mode)
        # --ci skips user-local canvas file existence (canvases live outside the repo).
        run: python tools/agent_contract.py --ci

      - name: Doc invariants (live docs must not re-introduce stale claims)
        run: python tools/doc_invariants.py

      - name: Engineering skills audit (methodology graft)
        run: python tools/engineering_skills_audit.py

      - name: No leftover merged or closed PR head branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --prune origin
          python tools/stale_pr_branches.py

      - name: Master branch protection
        # Advisory until a human admin token / GitHub Pro can apply the rule.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/master_branch_protection.py check

      - name: Maintainer IB-loop purity (fail on ib_loop_sync_io)
        run: python tools/maintainer_checks.py --fail-on-kind ib_loop_sync_io

  auto-merge:
    name: Auto-merge
    needs: [backend-test, frontend-build, frontend-e2e, agent-contract]
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Merge when gating CI is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOVA_GITHUB_REPO: ${{ github.repository }}
        run: python tools/pr_delivery.py merge --pr ${{ github.event.pull_request.number }} --wait-desktop-minutes 25
