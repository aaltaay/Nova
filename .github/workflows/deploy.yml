# Change-aware advisory CI. Policy: docs/ci.md and .cursor/rules/ci-scope.mdc.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    # `ready_for_review` is NOT in GitHub's default type list, so un-drafting a
    # PR used to fire nothing: no CI run, so no `workflow_run` for PR delivery
    # and no Auto-merge job, and the PR sat until the hourly sweep at :12.
    types: [opened, synchronize, reopened, ready_for_review]
  # Lets you run CI from Actions → CI → “Run workflow” when nothing has triggered yet
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/ci-scope.yml

  backend-test:
    name: Backend tests
    needs: [changes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify scope decision
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.backend }}
        run: |
          test "$SCOPE_RESULT" = success
          case "$SELECTED" in
            true) echo 'Selected: running verification.' >> "$GITHUB_STEP_SUMMARY" ;;
            false) echo 'Unaffected: heavy verification not needed.' >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo 'Invalid CI scope output'; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        if: needs.changes.outputs.backend == 'true'

      - uses: actions/setup-python@v5
        if: needs.changes.outputs.backend == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        id: install
        if: needs.changes.outputs.backend == 'true'
        run: pip install -r backend/requirements.txt pytest pytest-asyncio ruff==0.15.21

      - name: Ruff
        if: needs.changes.outputs.backend == 'true'
        run: ruff check backend

      - name: Run tests
        # Runs after a Ruff failure too, so a lint finding never hides the test
        # results: five findings once skipped pytest on every backend PR (#603).
        # The job still fails on lint; each step shows its own result.
        if: ${{ !cancelled() && needs.changes.outputs.backend == 'true' && steps.install.outcome == 'success' }}
        run: pytest backend/ -x -q --tb=short

  frontend-build:
    name: Frontend build
    needs: [changes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify scope decision
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.frontend }}
        run: |
          test "$SCOPE_RESULT" = success
          case "$SELECTED" in
            true) echo 'Selected: running verification.' >> "$GITHUB_STEP_SUMMARY" ;;
            false) echo 'Unaffected: heavy verification not needed.' >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo 'Invalid CI scope output'; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        if: needs.changes.outputs.frontend == 'true'
        with:
          # Full history so the injected vNNN tag is real, not a shallow-clone v001.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.frontend == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.frontend == 'true'
        run: npm ci
        working-directory: frontend

      - name: Lint
        if: needs.changes.outputs.frontend == 'true'
        run: npm run lint
        working-directory: frontend

      - name: Unit tests
        if: needs.changes.outputs.frontend == 'true'
        run: npm test -- --run
        working-directory: frontend

      - name: Build
        if: needs.changes.outputs.frontend == 'true'
        # Default URL keeps vite/meta/postbuild happy when Actions var is unset.
        run: |
          export VITE_API_BASE_URL="${VITE_API_BASE_URL:-https://ci-placeholder.invalid}"
          npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

  frontend-e2e:
    name: Frontend E2E
    needs: [changes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify scope decision
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.e2e }}
        run: |
          test "$SCOPE_RESULT" = success
          case "$SELECTED" in
            true) echo 'Selected: running verification.' >> "$GITHUB_STEP_SUMMARY" ;;
            false) echo 'Unaffected: heavy verification not needed.' >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo 'Invalid CI scope output'; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        if: needs.changes.outputs.e2e == 'true'

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.e2e == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.e2e == 'true'
        run: npm ci
        working-directory: frontend

      - name: Install Chromium
        if: needs.changes.outputs.e2e == 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Playwright
        if: needs.changes.outputs.e2e == 'true'
        run: npm run test:e2e
        working-directory: frontend

  gitleaks:
    name: Gitleaks
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Warning-only: step continue-on-error keeps the check green while
      # leaks still show in the job log. Job-level continue-on-error still
      # reports the check as failed.
      - uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    needs: [changes]
    uses: ./.github/workflows/security-scans.yml
    with:
      source: ${{ needs.changes.outputs.source == 'true' }}
      dependencies: ${{ needs.changes.outputs.dependencies == 'true' }}

  agent-contract:
    name: Agent contract
    needs: [changes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify scope decision
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.backend }}
        run: |
          test "$SCOPE_RESULT" = success
          case "$SELECTED" in
            true) echo 'Selected: running verification.' >> "$GITHUB_STEP_SUMMARY" ;;
            false) echo 'Unaffected: heavy verification not needed.' >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo 'Invalid CI scope output'; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest and ruff
        id: tools
        # ruff: the maintainer gate runs the backend lint (AGENTS.md §6.7); the
        # version is backend/requirements-dev.txt's pin.
        run: pip install pytest PyYAML==6.0.2 ruff==0.15.21

      # Every check below runs even when an earlier one failed, so each reports
      # its own result (docs/ci.md). Only a failed setup or a cancel skips them.
      - name: Agent tool tests
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tools/test_agent_contract.py tools/test_subagent_lifecycle_hook.py tools/test_sync_agent_surfaces.py tools/test_create_nova_agent.py tools/test_doc_invariants.py tools/test_engineering_skills_audit.py tools/test_stale_pr_branches.py tools/test_desktop_pack_workflow.py tools/test_master_branch_protection.py tools/test_pr_delivery.py tools/test_pr_delivery_workflow.py tools/test_branch_cleanup_merged.py tools/test_pr_review_status.py tools/test_nova_delivery_project.py tools/test_repo_hygiene.py tools/test_repo_hygiene_finish.py tools/test_session_brief_hook.py tools/test_backlog_triage.py tools/test_backlog_footprints.py tools/test_backlog_claims_table.py tools/test_backlog_branches.py tools/test_retired_ledgers.py tools/test_next_moves.py tools/test_premarket_verify.py tools/test_data_root.py tools/test_ci_scope.py tools/test_ci_scope_workflows.py tools/test_maintainer_checks.py tools/test_maintainer_policy.py tools/test_deploy_workflow_maintainer.py -q --tb=short

      - name: Structural validation (CI mode)
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        # --ci skips user-local canvas file existence (canvases live outside the repo).
        run: python tools/agent_contract.py --ci

      - name: Doc invariants (live docs must not re-introduce stale claims)
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: python tools/doc_invariants.py

      - name: Engineering skills audit (methodology graft)
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: python tools/engineering_skills_audit.py

      - name: Maintainer gate (AGENTS.md §2 and §6.3)
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        # One list of blocking kinds (tools/maintainer_lib/gate.py): entry
        # points, the 800-line ceiling, growth past 400 without a reason,
        # ownership, frozen cross-feature imports, money-path silence, IB-loop
        # purity, the backend lint (ruff). Growth is judged against the PR's
        # target branch; a push has no base and skips only that check.
        env:
          MAINTAINER_BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}
        run: python tools/maintainer_checks.py --gate --base "$MAINTAINER_BASE"

  auto-merge:
    name: Auto-merge
    # Long enough to wait out the five-minute settling floor plus its
    # twice-the-floor cap (pr-delivery-timing.mdc); a shorter timeout would
    # kill the job mid-wait and read as a red check.
    timeout-minutes: 13
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
      # Merging with GITHUB_TOKEN starts no `push:` run, so the merge
      # dispatches `Desktop pack` itself (#346). Without this the dispatch
      # 403s and the merged commit is silently never packed. Publishing is
      # separate: an operator pushes the vNNN release tag (#347).
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Merge ready PR without waiting for verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOVA_GITHUB_REPO: ${{ github.repository }}
        run: python tools/pr_delivery.py merge --pr ${{ github.event.pull_request.number }}
