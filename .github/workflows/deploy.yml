# CI (no cloud backend deploy)
#
# Backend is local / Desktop sidecar only -- Railway hosting is retired.
# On every push to main/master and on PRs targeting those branches:
#   1. backend-test   -- install Python deps, run pytest (no tests = OK, real failures block)
#   2. frontend-build -- npm ci + vite build (catches TypeScript / import errors)
#   3. security / agent-contract jobs (warning-only where noted)
#   4. doc_invariants.py inside agent-contract (blocks stale live-doc claims)
#
# Optional GitHub variable (Settings → Variables → Actions):
#   VITE_API_BASE_URL -- override for frontend CI build; defaults to a placeholder.
# Optional static frontend host: Vercel Git integration (not this workflow).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Lets you run CI from Actions → CI → “Run workflow” when nothing has triggered yet
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest

      - name: Run tests
        # Exit 5 means "no tests collected" — acceptable until tests are added.
        # GitHub's bash runs with `set -e`; pytest exit 5 would abort before we read $?.
        run: |
          set +e
          pytest backend/ -x -q --tb=short
          PYTEST_EXIT=$?
          set -e
          if [ "$PYTEST_EXIT" -eq 5 ]; then
            echo "No tests collected — OK"
            exit 0
          fi
          exit "$PYTEST_EXIT"
        shell: bash

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        # Default URL keeps vite/meta/postbuild happy when Actions var is unset.
        run: |
          export VITE_API_BASE_URL="${VITE_API_BASE_URL:-https://ci-placeholder.invalid}"
          npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

  security-audit:
    name: Security audit (warning-only)
    runs-on: ubuntu-latest
    # Runs on PR and push, same as backend-test.
    # continue-on-error: true keeps the pipeline green while the baseline is being established.
    # After baseline acceptance, remove continue-on-error and add --fail-on-findings
    # to tools/security_audit.py invocation to block on new CRITICAL/HIGH findings.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dev dependencies (includes pip-audit + cvss)
        run: pip install -r backend/requirements-dev.txt

      - name: Run security audit
        # Exits 0 always (warning-first). JSON output is captured as an artifact.
        # To enable blocking on findings: add --fail-on-findings and remove continue-on-error above.
        run: python tools/security_audit.py --json | tee security-audit-report.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: security-audit-report.json
          retention-days: 30

  # SEC-005 — dedicated scanners (gitleaks, osv-scanner, semgrep). Warning-only
  # until the baseline is clean enough to gate deploy.
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  osv-scanner:
    name: OSV Scanner
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action/osv-scanner-action@v2.0.3
        with:
          scan-args: |-
            -r
            --skip-git
            ./

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: p/python

  agent-contract:
    name: Agent contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest
        run: pip install pytest

      - name: Agent tool tests
        run: pytest tools/test_agent_contract.py tools/test_subagent_lifecycle_hook.py tools/test_sync_agent_surfaces.py tools/test_create_nova_agent.py tools/test_doc_invariants.py -q --tb=short

      - name: Structural validation (CI mode)
        # --ci skips user-local canvas file existence (canvases live outside the repo).
        run: python tools/agent_contract.py --ci

      - name: Doc invariants (live docs must not re-introduce stale claims)
        run: python tools/doc_invariants.py
