name: Feature
description: Propose a Nova capability with explicit scope and acceptance criteria.
title: "Feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Product roadmap phases remain governed by Nova-Roadmap-Status.md. Do not use an issue to silently promote parked roadmap work.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who needs this and what outcome is missing?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: State what this feature includes and deliberately excludes.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Proposed priority
      options:
        - P0 - trading safety or total outage
        - P1 - major reliability or operator blocker
        - P2 - normal product work
        - P3 - low-priority enhancement
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      options:
        - execution
        - ibkr-ops
        - market-feed
        - frontend
        - tester
        - security
        - docs
        - other
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable checks that must pass before this issue can close.
      placeholder: |
        - [ ] Behavior implemented
        - [ ] Tests and build pass
        - [ ] Browser or operational evidence recorded
    validations:
      required: true
  - type: textarea
    id: milestone
    attributes:
      label: Release or roadmap target
      description: Name the real Milestone, or explain why this is not release-bound.
    validations:
      required: true
  - type: textarea
    id: relationships
    attributes:
      label: Relationships and blockers
      description: Parent, sub-issue, blocked-by, duplicate, or related issue numbers. Write "none" when there is no real relationship.
    validations:
      required: true
